# Echo on one VM: Echo (no published port) behind Caddy (HTTPS via Let's Encrypt), and
# optionally Hermes Agent (profile "hermes", no published port; only Echo reaches it at
# http://hermes:8090/whatsapp/webhook) with the studio gateway (profile "hermes", only Hermes
# reaches it at http://studio:8091/mcp) and the render service (profile "hermes", only studio reaches
# it, on an internal network without internet). Set up with deploy/oracle/hermes/setup-hermes.sh.
# Run: docker compose -f /opt/echo/app/deploy/oracle/docker-compose.yml --env-file /opt/echo/.env up -d --build
#      (add --profile hermes once Hermes is set up; update.sh does that by itself)
name: echo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  echo:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: echo:local
    env_file: /opt/echo/.env
    environment:
      ECHO_CONFIG: /config/config.json
    volumes:
      - /opt/echo/config.json:/config/config.json:ro
      - echo-data:/data
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    depends_on:
      - echo
    ports:
      - "80:80"
      - "443:443"
    environment:
      ECHO_HOST: ${ECHO_HOST:?set ECHO_HOST in /opt/echo/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging

  hermes:
    profiles: ["hermes"]
    # Official multi-arch image (amd64 + arm64); "stable" is the release-gated channel.
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:stable}
    command: ["gateway", "run"]
    environment:
      # Files in /opt/hermes/data stay owned by the VM user (ubuntu).
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
    volumes:
      # Hermes' HERMES_HOME: .env, config.yaml, SOUL.md, auth.json, mcp-tokens/, sessions, logs.
      - /opt/hermes/data:/opt/data
    restart: unless-stopped
    logging: *logging

  studio:
    # Studio gateway (src/studio): Hermes generates images/audio through it with the club's
    # Higgsfield account, within config.json "studio" limits. No published port; only Hermes
    # reaches it at http://studio:8091/mcp with ECHO_STUDIO_TOKEN. Same image as Echo.
    profiles: ["hermes"]
    image: echo:local
    command: ["node", "--no-warnings", "src/studio/index.js"]
    depends_on:
      - echo
    env_file: /opt/echo/.env
    environment:
      ECHO_CONFIG: /config/config.json
      STUDIO_BRAND_KIT: /config/brand-kit.md
      # Mounted at the same paths Hermes sees them (its HERMES_HOME is /opt/data), so a
      # MEDIA:<path> the gateway hands out is a file Hermes can send.
      STUDIO_PREVIEW_DIR: /opt/data/cache/generated/echo-studio
      STUDIO_REFERENCE_DIRS: /opt/data/cache/images
    # The VM user (Hermes' uid), so Hermes can read the previews. echo-data (/data) is owned by
    # the echo service's node user (uid 1000), which need not be this uid (e.g. ubuntu is 1001 on
    # some VMs); studio only writes /data/studio, which studio-prepare.sh (run by update.sh and
    # setup-hermes.sh) makes and gives to HERMES_UID:HERMES_GID.
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    volumes:
      - /opt/echo/config.json:/config/config.json:ro
      - /opt/echo/brand-kit.md:/config/brand-kit.md:ro
      # Originals, studio.db and the Higgsfield tokens (0600) live in /data/studio.
      - echo-data:/data
      - /opt/hermes/data/cache/generated/echo-studio:/opt/data/cache/generated/echo-studio
      - /opt/hermes/data/cache/images:/opt/data/cache/images:ro
    # default: Hermes, Higgsfield, TryPost; render: the render service (no route out).
    networks: [default, render]
    restart: unless-stopped
    logging: *logging

  render:
    # Render service (src/render, deploy/oracle/render/Dockerfile): the studio's videos (Chromium +
    # ffmpeg, whisper.cpp subtitles). Only the studio reaches it (http://render:8092, bearer
    # ECHO_RENDER_TOKEN, made by render/render-prepare.sh). It is only on the internal "render"
    # network (no internet), gets no env_file (no WhatsApp/Higgsfield/TryPost secrets), runs as a
    # non-root user on a read-only root with a tmpfs /tmp, and is capped so an OOM or a runaway job
    # only ever kills this container: mem_limit (no swap), cpus, pids, and the highest OOM score.
    profiles: ["hermes"]
    build:
      context: ../..
      dockerfile: deploy/oracle/render/Dockerfile
    image: echo-render:local
    # tini as PID 1: reaps Chromium's child processes after a killed job.
    init: true
    environment:
      ECHO_RENDER_TOKEN: ${ECHO_RENDER_TOKEN:-}
      RENDER_TIMEOUT_SEC: ${RENDER_TIMEOUT_SEC:-300}
    networks: [render]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.5
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 256
    oom_score_adj: 1000
    restart: unless-stopped
    logging: *logging

networks:
  render:
    internal: true

volumes:
  echo-data:
  caddy-data:
  caddy-config:
