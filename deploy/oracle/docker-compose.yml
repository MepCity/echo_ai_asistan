# Echo on one VM: Echo (no published port) behind Caddy (HTTPS via Let's Encrypt), and
# optionally Hermes Agent (profile "hermes", no published port; only Echo reaches it at
# http://hermes:8090/whatsapp/webhook). Set up Hermes with deploy/oracle/hermes/setup-hermes.sh.
# Run: docker compose -f /opt/echo/app/deploy/oracle/docker-compose.yml --env-file /opt/echo/.env up -d --build
#      (add --profile hermes once Hermes is set up; update.sh does that by itself)
name: echo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  echo:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: echo:local
    env_file: /opt/echo/.env
    environment:
      ECHO_CONFIG: /config/config.json
    volumes:
      - /opt/echo/config.json:/config/config.json:ro
      - echo-data:/data
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    depends_on:
      - echo
    ports:
      - "80:80"
      - "443:443"
    environment:
      ECHO_HOST: ${ECHO_HOST:?set ECHO_HOST in /opt/echo/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging

  hermes:
    profiles: ["hermes"]
    # Official multi-arch image (amd64 + arm64); "stable" is the release-gated channel.
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:stable}
    command: ["gateway", "run"]
    environment:
      # Files in /opt/hermes/data stay owned by the VM user (ubuntu).
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
    volumes:
      # Hermes' HERMES_HOME: .env, config.yaml, SOUL.md, auth.json, mcp-tokens/, sessions, logs.
      - /opt/hermes/data:/opt/data
    restart: unless-stopped
    logging: *logging

volumes:
  echo-data:
  caddy-data:
  caddy-config:
