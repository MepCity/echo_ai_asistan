# Echo on one VM: Echo (no published port) behind Caddy (HTTPS via Let's Encrypt), and
# optionally Hermes Agent (profile "hermes", no published port; only Echo reaches it at
# http://hermes:8090/whatsapp/webhook) with the studio gateway (profile "hermes", only Hermes
# reaches it at http://studio:8091/mcp). Set up both with deploy/oracle/hermes/setup-hermes.sh.
# Run: docker compose -f /opt/echo/app/deploy/oracle/docker-compose.yml --env-file /opt/echo/.env up -d --build
#      (add --profile hermes once Hermes is set up; update.sh does that by itself)
name: echo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  echo:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: echo:local
    env_file: /opt/echo/.env
    environment:
      ECHO_CONFIG: /config/config.json
    volumes:
      - /opt/echo/config.json:/config/config.json:ro
      - echo-data:/data
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    depends_on:
      - echo
    ports:
      - "80:80"
      - "443:443"
    environment:
      ECHO_HOST: ${ECHO_HOST:?set ECHO_HOST in /opt/echo/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging

  hermes:
    profiles: ["hermes"]
    # The official multi-arch image (amd64 + arm64; "stable" is the release-gated channel) plus
    # faster-whisper for voice messages (hermes/Dockerfile). setup-hermes.sh (run by update.sh)
    # rebuilds it with --pull, so a new official image is picked up on every update.
    build:
      context: ./hermes
      dockerfile: Dockerfile
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:stable}
    image: echo-hermes:local
    command: ["gateway", "run"]
    environment:
      # Files in /opt/hermes/data stay owned by the VM user (ubuntu).
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # Hugging Face cache (the Whisper model, stt.local.model in config.yaml) on the data volume:
      # downloaded once, kept across container recreation and image updates.
      HF_HOME: /opt/data/cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      # Hermes' HERMES_HOME: .env, config.yaml, SOUL.md, auth.json, mcp-tokens/, sessions, logs.
      - /opt/hermes/data:/opt/data
    restart: unless-stopped
    logging: *logging

  studio:
    # Studio gateway (src/studio): Hermes generates images/audio through it with the club's
    # Higgsfield account, within config.json "studio" limits. No published port; only Hermes
    # reaches it at http://studio:8091/mcp with ECHO_STUDIO_TOKEN. Same image as Echo.
    profiles: ["hermes"]
    image: echo:local
    command: ["node", "--no-warnings", "src/studio/index.js"]
    depends_on:
      - echo
    env_file: /opt/echo/.env
    environment:
      ECHO_CONFIG: /config/config.json
      STUDIO_BRAND_KIT: /config/brand-kit.md
      # Mounted at the same paths Hermes sees them (its HERMES_HOME is /opt/data), so a
      # MEDIA:<path> the gateway hands out is a file Hermes can send, and the path Hermes gives
      # the model for a picture the user sent is the path the studio opens.
      STUDIO_PREVIEW_DIR: /opt/data/cache/generated/echo-studio
      # Pictures people sent: the whatsapp_cloud adapter saves them in platforms/whatsapp_cloud/media
      # (<media id>.jpg); cache/images is where Hermes' other adapters cache them.
      STUDIO_REFERENCE_DIRS: /opt/data/platforms/whatsapp_cloud/media,/opt/data/cache/images
    # The VM user (Hermes' uid), so Hermes can read the previews. echo-data (/data) is owned by
    # the echo service's node user (uid 1000), which need not be this uid (e.g. ubuntu is 1001 on
    # some VMs); studio only writes /data/studio, which studio-prepare.sh (run by update.sh and
    # setup-hermes.sh) makes and gives to HERMES_UID:HERMES_GID.
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    volumes:
      - /opt/echo/config.json:/config/config.json:ro
      - /opt/echo/brand-kit.md:/config/brand-kit.md:ro
      # Originals, studio.db and the Higgsfield tokens (0600) live in /data/studio.
      - echo-data:/data
      - /opt/hermes/data/cache/generated/echo-studio:/opt/data/cache/generated/echo-studio
      # Read-only, and only these two media folders (never the rest of Hermes' data: .env, auth.json).
      - /opt/hermes/data/platforms/whatsapp_cloud/media:/opt/data/platforms/whatsapp_cloud/media:ro
      - /opt/hermes/data/cache/images:/opt/data/cache/images:ro
    restart: unless-stopped
    logging: *logging

volumes:
  echo-data:
  caddy-data:
  caddy-config:
